# 推送到 main 时自动打包，把 zip 安装包发布到 GitHub Release，新版本同时发布到 npm。
# Release 按版本号命名为 v<版本号>（mcp-server/package.json 与 extension/manifest.json 的版本，二者必须一致）：
# - 这个版本还没发布过：新建 Release 和标签
# - 已经发布过（版本号没变）：把标签移到这次提交，替换安装包并更新说明
# npm 上没有这个版本时发布 @h025/browserbridge-mcp，已有则跳过。
# 要发布新版本时，先改版本号再推送。也可以在 Actions 页面手动运行。
name: 打包发布

on:
  push:
    branches: [main]
  workflow_dispatch:

# 连续推送时按顺序发布，避免同时改同一个 Release
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: 安装构建依赖
        run: npm ci
        working-directory: mcp-server

      - name: 生成安装包
        id: build
        run: |
          node scripts/package.mjs
          VERSION=$(node -p "require('./mcp-server/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=dist/browser-bridge-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          TAG="v$VERSION"
          cat > notes.md <<EOF
          ## 安装

          需要 Node.js 18 或更高版本。

          1. 下载下面的 \`browser-bridge-$VERSION.zip\` 并解压
          2. 注册 MCP 服务：macOS / Linux 在解压目录运行 \`./install.sh\`，Windows 双击 \`install.cmd\`
          3. 打开 \`chrome://extensions\`，打开右上角的「开发者模式」，点「加载已解压的扩展程序」，选择解压目录里的 \`extension\` 文件夹
          4. 重启 Claude Code 等客户端

          也可以用 npm 安装：\`npx -y @h025/browserbridge-mcp extension\` 导出扩展，客户端里用 \`npx -y @h025/browserbridge-mcp\` 启动服务。

          升级时用新文件替换原目录，再在 \`chrome://extensions\` 里点扩展的刷新按钮。详见[使用指南](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/guide.md)。

          构建自提交 ${GITHUB_SHA::7}：$(git log -1 --format=%s)
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "Browser Bridge $TAG" --notes-file notes.md
          fi

  # 用 npm 的受信发布（OIDC）：npmjs.com 上已信任本仓库的 release.yml，不需要 npm 令牌，并自动附带来源证明。
  # 等 Release 打包成功后再发布
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Node 24 自带的 npm 11 支持受信发布（需要 11.5.1 以上）
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: 安装构建依赖
        run: npm ci
        working-directory: mcp-server

      - name: 发布到 npm
        working-directory: mcp-server
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "npm $(npm -v)"
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
            echo "$NAME@$VERSION 已在 npm 上，跳过发布"
          else
            npm publish
          fi
