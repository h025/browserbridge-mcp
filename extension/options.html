<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Browser Bridge</title>
  <style>
    :root { color-scheme: light dark; --gradient: linear-gradient(90deg, #3B82F6, #8B5CF6, #EC4899, #F59E0B); --accent: #8B5CF6; --muted: #888; --line: rgba(127,127,127,.35); }
    body { margin: 0; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 40px auto; padding: 0 20px; }
    h1 { display: flex; align-items: center; gap: 10px; font-size: 20px; margin: 0 0 20px; }
    h1 img { width: 28px; height: 28px; }
    h1 span { background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h2 { font-size: 16px; margin: 0 0 4px; }
    section + section { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--line); }
    .check { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; font-weight: 600; cursor: pointer; }
    .check input { flex: none; margin-top: 4px; }
    .lead { color: var(--muted); margin: 0 0 24px; }
    label { display: block; font-weight: 600; margin-top: 16px; }
    .help { color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 2px; }
    .field { display: flex; gap: 8px; margin-top: 6px; }
    input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    button.primary { background: var(--gradient); border-color: transparent; color: #fff; font-weight: 600; }
    button.primary:hover { filter: brightness(1.08); }
    .check input { accent-color: var(--accent); }
    .actions { display: flex; gap: 8px; margin-top: 24px; }
    .status { margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: rgba(127,127,127,.12); white-space: pre-wrap; word-break: break-all; }
    .status:empty { display: none; }
    .status.ok { background: rgba(42,157,75,.14); }
    .status.err { background: rgba(204,51,51,.14); }
    .mode { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1><img src="icons/icon-48.png" alt=""><span data-i18n="optionsTitle"></span></h1>
    <section>
    <h2 data-i18n="aiSection"></h2>
    <p class="lead" data-i18n="aiLead"></p>

    <label for="baseUrl"><span data-i18n="aiBaseUrl"></span>
      <div class="help" data-i18n="aiBaseUrlHelp"></div>
    </label>
    <div class="field"><input id="baseUrl" type="url" placeholder="https://api.openai.com/v1" autocomplete="off" spellcheck="false"></div>

    <label for="apiKey"><span data-i18n="aiApiKey"></span>
      <div class="help" data-i18n="aiApiKeyHelp"></div>
    </label>
    <div class="field">
      <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
      <button id="toggleKey" type="button" data-i18n="show"></button>
    </div>

    <label for="model"><span data-i18n="aiModel"></span>
      <div class="help" data-i18n="aiModelHelp"></div>
    </label>
    <div class="field"><input id="model" type="text" placeholder="gpt-4o-mini" autocomplete="off" spellcheck="false"></div>

    <div class="actions">
      <button id="save" class="primary" data-i18n="save"></button>
      <button id="test" data-i18n="testConnection"></button>
      <button id="clear" data-i18n="clearConfig"></button>
    </div>
    <div id="status" class="status"></div>

    <div class="mode" id="mode"></div>
    <p class="mode" data-i18n="aiPrivacy"></p>
    </section>

    <section>
    <h2 data-i18n="inputSection"></h2>
    <label class="check"><input id="humanTyping" type="checkbox">
      <span><span data-i18n="humanTyping"></span>
        <div class="help" data-i18n="humanTypingHelp"></div>
      </span>
    </label>
    <div id="inputStatus" class="status"></div>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
